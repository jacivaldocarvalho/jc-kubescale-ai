apiVersion: apps/v1
kind: Deployment
metadata:
  name: jc-kubescale-canary
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jc-kubescale-canary
  template:
    metadata:
      labels:
        app: jc-kubescale-canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: jc-kubescale-canary
      containers:
        - name: canary
          image: jc-kubescale-canary:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TARGET_NAMESPACE
              value: "jc-kubescale"
            - name: TARGET_DEPLOYMENT
              value: "jc-kubescale-api"
            - name: CANARY_STAGES
              value: "10,50,100"
            - name: CANARY_INTERVAL
              value: "30"
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.observability.svc.cluster.local:80"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jc-kubescale-canary
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-canary
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: jc-kubescale-canary
