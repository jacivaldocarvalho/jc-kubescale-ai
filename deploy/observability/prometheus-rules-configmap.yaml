apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: observability
data:
  alerts.yaml: |
    groups:
      - name: jc-kubescale-alerts
        rules:
          - alert: APIDown
            expr: up{job="jc-kubescale-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "API is down"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_latency_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High latency detected"

          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
