apiVersion: v1
kind: ServiceAccount
metadata:
  name: jc-kubescale-api
  namespace: jc-kubescale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jc-kubescale-api
  namespace: jc-kubescale
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jc-kubescale-api
  namespace: jc-kubescale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jc-kubescale-api
subjects:
  - kind: ServiceAccount
    name: jc-kubescale-api
    namespace: jc-kubescale
