apiVersion: apps/v1
kind: Deployment
metadata:
  name: jc-kubescale-api
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-api
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jc-kubescale-api
  template:
    metadata:
      labels:
        app: jc-kubescale-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: jc-kubescale-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DEBUG
              value: "true"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: INFERENCE_ENDPOINT
              value: "http://localhost:8080"
            - name: MODEL_NAME
              value: "qwen"
            - name: MODEL_VERSION
              value: "1"
            - name: AUTH_ENABLED
              value: "false"
            - name: RATE_LIMIT_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10