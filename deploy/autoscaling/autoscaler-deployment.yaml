apiVersion: apps/v1
kind: Deployment
metadata:
  name: jc-kubescale-autoscaler
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jc-kubescale-autoscaler
  template:
    metadata:
      labels:
        app: jc-kubescale-autoscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: jc-kubescale-autoscaler
      containers:
        - name: autoscaler
          image: jc-kubescale-autoscaler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TARGET_NAMESPACE
              value: "jc-kubescale"
            - name: TARGET_DEPLOYMENT
              value: "jc-kubescale-api"
            - name: MIN_REPLICAS
              value: "1"
            - name: MAX_REPLICAS
              value: "10"
            - name: QUEUE_DEPTH_THRESHOLD
              value: "5"
            - name: KV_CACHE_THRESHOLD
              value: "80"
            - name: P95_LATENCY_THRESHOLD
              value: "2.0"
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.observability.svc.cluster.local:80"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jc-kubescale-autoscaler
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-autoscaler
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: jc-kubescale-autoscaler