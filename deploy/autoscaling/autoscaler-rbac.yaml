apiVersion: v1
kind: ServiceAccount
metadata:
  name: jc-kubescale-autoscaler
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jc-kubescale-autoscaler
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-autoscaler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jc-kubescale-autoscaler
  namespace: jc-kubescale
  labels:
    app: jc-kubescale-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jc-kubescale-autoscaler
subjects:
  - kind: ServiceAccount
    name: jc-kubescale-autoscaler
    namespace: jc-kubescale