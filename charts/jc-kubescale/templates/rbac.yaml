{{- if .Values.security.rbacEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "jc-kubescale.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jc-kubescale.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["model-registry"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "jc-kubescale.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jc-kubescale.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "jc-kubescale.fullname" . }}-registry
subjects:
  - kind: ServiceAccount
    name: {{ include "jc-kubescale.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
