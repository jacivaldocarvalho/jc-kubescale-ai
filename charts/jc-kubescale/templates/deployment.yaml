apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jc-kubescale.fullname" . }}-api
  labels:
    {{- include "jc-kubescale.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "jc-kubescale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "jc-kubescale.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jc-kubescale.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: API_TITLE
              value: "JC-KubeScale AI API"
            - name: API_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: DEBUG
              value: {{ .Values.config.debug | quote }}
            - name: INFERENCE_ENDPOINT
              value: {{ .Values.config.inferenceEndpoint | quote }}
            - name: MODEL_NAME
              value: {{ .Values.config.modelName | quote }}
            - name: MODEL_VERSION
              value: {{ .Values.config.modelVersion | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.config.authEnabled | quote }}
            - name: RATE_LIMIT_ENABLED
              value: {{ .Values.config.rateLimitEnabled | quote }}
            - name: OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}