apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: observability
data:
  alerts.yaml: |
    groups:
      - name: jc-kubescale-alerts
        rules:
          - alert: APIDown
            expr: up{job="jc-kubescale-api"} == 0
            for: 1m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "JC-KubeScale API is down"
              description: "API pod has been down for more than 1 minute"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_latency_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High API latency detected"
              description: "P95 latency is above 2 seconds"

          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 5%"

          - alert: HighActiveRequests
            expr: http_active_requests > 100
            for: 2m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High active requests"
              description: "More than 100 active requests"